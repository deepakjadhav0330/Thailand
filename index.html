
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThaiTrip Split</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:#f4f6f8;font-family:Arial,sans-serif;padding:20px;max-width:600px;margin:auto}
h1{margin-bottom:4px;font-size:29px}
.sub{color:#aebbc7;margin-top:0}
.card{background:#1c2935;padding:17px;border-radius:16px;margin:16px 0}
label{display:block;margin:12px 0 6px;color:#c6d2dc;font-size:14px}
input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #435260;background:#101820;color:white;font-size:16px}
button{background:#20c997;color:#08251d;font-weight:bold;border:0;margin-top:14px}
.stat{font-size:25px;font-weight:bold;margin-top:7px}
.small{color:#aebbc7;font-size:13px}
.item{padding:12px 0;border-bottom:1px solid #435260}
.item:last-child{border-bottom:0}
.amount{color:#64e6b1;font-weight:bold}
</style>
</head>
<body>
<h1>🇹🇭 ThaiTrip Split</h1>
<p class="sub">Three friends. One trip. Fair expenses.</p>

<div class="card">
<div class="small">TOTAL TRIP EXPENSES</div>
<div class="stat" id="total">฿0</div>
<p class="small">Thai Baht · <span id="inr">₹0</span> estimated</p>
<label>THB to INR rate</label>
<input id="rate" type="number" value="2.5" step="0.01" min="0.01">
</div>

<div class="card">
<h3>Add an expense</h3>
<label>Expense description</label>
<input id="desc" placeholder="e.g. Dinner, Grab, Hotel">
<label>Amount (฿)</label>
<input id="amount" type="number" min="1" placeholder="e.g. 1200">
<label>Paid by</label>
<select id="payer"></select>
<label>Split between</label>
<div id="split"></div>
<button onclick="addExpense()">＋ Add expense</button>
</div>

<div class="card">
<h3>Expense history</h3>
<div id="expenses"><p class="small">No expenses yet. Add your first one!</p></div>
</div>

<div class="card">
<h3>Settlement</h3>
<p class="small">Positive means they should receive money; negative means they owe money.</p>
<div id="balances"></div>
<div id="settlement"></div>
</div>

<script>
const friends=["You","Friend 2","Friend 3"];
let expenses=[];
try{expenses=JSON.parse(localStorage.getItem("thaiTripExpenses")||"[]")}catch(e){expenses=[]}
const payer=document.getElementById("payer");
const split=document.getElementById("split");
friends.forEach((name,i)=>{
 let option=document.createElement("option");
 option.value=i;option.textContent=name;payer.appendChild(option);
 split.insertAdjacentHTML("beforeend",
 `<label><input type="checkbox" id="s${i}" checked style="width:auto;margin-right:8px"> ${name}</label>`);
});
function money(n){return "฿"+n.toLocaleString("en-US",{maximumFractionDigits:2})}
function render(){
 const total=expenses.reduce((s,e)=>s+e.amount,0);
 document.getElementById("total").textContent=money(total);
 document.getElementById("inr").textContent="₹"+Math.round(total*(Number(document.getElementById("rate").value)||0)).toLocaleString("en-IN");
 document.getElementById("expenses").innerHTML=expenses.length?expenses.slice().reverse().map(e=>
 `<div class="item"><strong>${escapeText(e.desc)}</strong><div class="small">${friends[e.payer]} paid · split ${e.split.map(i=>friends[i]).join(", ")}</div><div class="amount">${money(e.amount)}</div></div>`
 ).join(""):'<p class="small">No expenses yet. Add your first one!</p>';
 let bal=[0,0,0];
 expenses.forEach(e=>{
  bal[e.payer]+=e.amount;
  e.split.forEach(i=>bal[i]-=e.amount/e.split.length);
 });
 document.getElementById("balances").innerHTML=bal.map((b,i)=>
 `<div class="item">${friends[i]} <strong style="float:right;color:${b>=0?'#64e6b1':'#ff9b9b'}">${b>=0?'+':'−'}${money(Math.abs(b))}</strong></div>`
 ).join("");
 let creditors=bal.map((v,i)=>({i,v})).filter(x=>x.v>0.01);
 let debtors=bal.map((v,i)=>({i,v:-xSafe(v)})).filter(x=>x.v>0.01);
 let transfers=[];
 creditors.forEach(c=>debtors.forEach(d=>{
  let n=Math.min(c.v,d.v);
  if(n>0.01){transfers.push(`${friends[d.i]} pays ${friends[c.i]} ${money(n)}`);c.v-=n;d.v-=n;}
 }));
 document.getElementById("settlement").innerHTML=transfers.length?transfers.map(t=>`<div class="item">${t}</div>`).join(""):'<p class="small">Everyone is settled up!</p>';
}
function xSafe(v){return v}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function addExpense(){
 const desc=document.getElementById("desc").value.trim();
 const amount=Number(document.getElementById("amount").value);
 const selected=friends.map((_,i)=>i).filter(i=>document.getElementById("s"+i).checked);
 if(!desc||!Number.isFinite(amount)||amount<=0){alert("Enter a description and a valid amount.");return}
 if(!selected.length){alert("Select at least one person to split the expense.");return}
 expenses.push({desc,amount,payer:Number(payer.value),split:selected});
 localStorage.setItem("thaiTripExpenses",JSON.stringify(expenses));
 document.getElementById("desc").value="";
 document.getElementById("amount").value="";
 render();
}
document.getElementById("rate").addEventListener("input",render);
render();
</script>
</body>
</html>
