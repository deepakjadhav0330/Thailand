
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThaiTrip Split</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: dark;
  --glass: rgba(255, 255, 255, 0.075);
  --glass-border: rgba(255, 255, 255, 0.16);
  --text: #f4f8ff;
  --muted: #a7b8d1;
  --cyan: #55e5ff;
  --blue: #438cff;
  --green: #55efbd;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #071322;
}

body {
  margin: 0 auto;
  padding: 32px 20px 60px;
  max-width: 760px;
  min-height: 100vh;
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  background:
    radial-gradient(ellipse at 5% 0%, rgba(0, 190, 255, .20), transparent 40%),
    radial-gradient(ellipse at 95% 25%, rgba(102, 90, 255, .18), transparent 38%),
    radial-gradient(ellipse at 50% 100%, rgba(0, 220, 180, .10), transparent 45%),
    #071322;
}

h1 {
  margin: 8px 0;
  font-size: clamp(30px, 6vw, 43px);
  letter-spacing: -1.5px;
  font-weight: 800;
}

h3 {
  margin-top: 0;
  font-size: 19px;
  letter-spacing: -.3px;
}

.sub, .small {
  color: var(--muted);
  line-height: 1.6;
}

.card {
  margin: 18px 0;
  padding: 23px;
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,.105),
    rgba(255,255,255,.035)
  );
  box-shadow:
    0 18px 50px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #d9e8fb;
  font-size: 14px;
  font-weight: 600;
}

input, select, button {
  width: 100%;
  min-height: 48px;
  padding: 13px 15px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 14px;
  color: var(--text);
  font: inherit;
}

input, select {
  background: rgba(4,15,31,.65);
  outline: none;
}

input:focus, select:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(85,229,255,.12);
}

button {
  margin-top: 12px;
  border: 1px solid rgba(255,255,255,.22);
  background: linear-gradient(110deg, #167dff, #16bde9);
  color: white;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(22,150,255,.18);
  transition: transform .18s ease, filter .18s ease;
}

button:hover {
  filter: brightness(1.12);
  transform: translateY(-1px);
}

button:active {
  transform: scale(.985);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.stat {
  margin: 12px 0;
  font-size: clamp(32px, 7vw, 44px);
  font-weight: 800;
  letter-spacing: -1px;
  color: var(--green);
}

.item {
  padding: 16px 2px;
  border-bottom: 1px solid rgba(255,255,255,.10);
  overflow-wrap: anywhere;
  line-height: 1.65;
}

.item:last-child {
  border-bottom: 0;
}

.amount {
  color: var(--green);
  font-weight: 800;
}

.delete {
  width: auto;
  min-height: 36px;
  padding: 8px 13px;
  margin: 0 0 8px 10px;
  float: right;
  border-color: rgba(255,110,130,.28);
  background: rgba(200,45,75,.20);
  color: #ffb3c0;
  box-shadow: none;
}

#status {
  font-size: 13px;
  overflow-wrap: anywhere;
  color: var(--cyan);
}

#adminCard {
  border-color: rgba(85,229,255,.22);
}

#inr {
  font-size: 15px;
}

@media (max-width: 520px) {
  body {
    padding: 20px 13px 40px;
  }

  .card {
    padding: 18px;
    border-radius: 20px;
    margin: 14px 0;
  }

  h1 {
    font-size: 31px;
  }

  .item {
    padding: 14px 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
  }
}
.built-by {
  margin: 36px 0 12px;
  padding: 20px 12px;
  text-align: center;
  color: #a7b8d1;
  font-size: 13px;
  letter-spacing: .5px;
  border-top: 1px solid rgba(255,255,255,.10);
}

.built-by span {
  color: #ff7295;
}

.built-by strong {
  color: #55e5ff;
  font-weight: 800;
}
</style>
</head>
<body>
<h1>🇹🇭 ThaiTrip Split</h1>
<p class="sub">DJ · Ayesha · Pratik</p>

<div class="card">
<div class="small">TOTAL SHARED EXPENSES</div>
<div class="stat" id="total">฿0</div>
<div id="inr" class="small">₹0 estimated</div>
<label>THB to INR exchange rate</label>
<input id="rate" type="number" value="2.81" min="0.01" step="0.01">
<p id="status">Connecting to shared database…</p>

<div class="card" id="adminCard">
  <h3>DJ admin login</h3>
  <label>Email</label>
  <input id="adminEmail" type="email" placeholder="DJ account email">
  <label>Password</label>
  <input id="adminPassword" type="password" placeholder="DJ password">
  <button onclick="signInDJ()">Sign in as DJ</button>
  <button onclick="signOutDJ()" id="signOutButton" style="display:none">Sign out</button>
  <p id="authStatus" class="small"></p>
</div>

</div>

<div class="card">
<h3>Add expense</h3>
<label>Description</label>
<input id="desc" placeholder="Dinner, taxi, hotel…">
<label>Amount (THB ฿)</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="1200">
<label>Paid by</label>
<select id="payer">
<option>DJ</option><option>Ayesha</option><option>Pratik</option>
</select>
<label>Split between</label>
<label><input class="person" type="checkbox" value="DJ" checked style="width:auto"> DJ</label>
<label><input class="person" type="checkbox" value="Ayesha" checked style="width:auto"> Ayesha</label>
<label><input class="person" type="checkbox" value="Pratik" checked style="width:auto"> Pratik</label>
<button id="add" onclick="addExpense()">＋ Add shared expense</button>
</div>

<div class="card">
<h3>Shared expense history</h3>
<div id="expenses">Loading…</div>
</div>

<div class="card">
<h3>Settlement</h3>
<div class="small">Positive balance means they should receive money; negative means they owe money.</div>
<div id="balances"></div>
<div id="settlement"></div>
</div>

<script>
const PROJECT_URL = "https://dfawemtboacvbsugbytw.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_ktqBJjyiwc7iOARXkvN0hQ_8ELqatta";
const db = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);
const friends = ["DJ","Ayesha","Pratik"];
let expenses = [];
let busy = false;
 const DJ_UID = "c8c7ae0f-0907-4dc6-9dbd-16dedced5d8c";
let isDJ = false;

const el = id => document.getElementById(id);
const safe = s => String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const money = n => "฿"+n.toLocaleString("en-US",{maximumFractionDigits:2});

function setStatus(message){el("status").textContent=message}
 async function refreshAuth(){
  const {data,error}=await db.auth.getUser();
  isDJ=!error && data.user?.id===DJ_UID;

  el("adminCard").querySelector("button").style.display=isDJ?"none":"block";
  el("adminEmail").style.display=isDJ?"none":"block";
  el("adminPassword").style.display=isDJ?"none":"block";
  el("signOutButton").style.display=isDJ?"block":"none";
  el("authStatus").textContent=isDJ
    ?"Signed in as DJ. Delete enabled."
    :"Not signed in as DJ.";
  render();
}

async function signInDJ(){
  const email=el("adminEmail").value.trim();
  const password=el("adminPassword").value;
  const {data,error}=await db.auth.signInWithPassword({email,password});

  if(error){
    el("authStatus").textContent="Login failed: "+error.message;
    return;
  }

  if(data.user.id!==DJ_UID){
    await db.auth.signOut();
    el("authStatus").textContent="This is not the DJ admin account.";
    return;
  }

  el("adminPassword").value="";
  await refreshAuth();
}

async function signOutDJ(){
  await db.auth.signOut();
  await refreshAuth();
}

async function loadExpenses(){
 const {data,error}=await db.from("expenses").select("*").order("created_at",{ascending:false});
 if(error){setStatus("Database error: "+error.message);return}
 expenses=data||[];
 setStatus("Connected · shared expenses loaded");
 render();
}

function render(){
 const total=expenses.reduce((s,e)=>s+Number(e.amount),0);
 el("total").textContent=money(total);
 el("inr").textContent="₹"+Math.round(total*(Number(el("rate").value)||0)).toLocaleString("en-IN")+" estimated";
 el("expenses").innerHTML=expenses.length?expenses.map(e=>
 `<div class="item">
 ${isDJ ? `<button class="delete" onclick="deleteExpense(${Number(e.id)})">Delete</button>` : ""}
 <strong>${safe(e.description)}</strong>
 <div class="small">${safe(e.paid_by)} paid · split ${Array.isArray(e.split_between)?e.split_between.map(safe).join(", "):""}</div>
 <div class="amount">${money(Number(e.amount))}</div>
 </div>`).join(""):'<p class="small">No shared expenses yet.</p>';

 const bal={DJ:0,Ayesha:0,Pratik:0};
 expenses.forEach(e=>{
  const amount=Number(e.amount);
  const people=Array.isArray(e.split_between)?e.split_between:[];
  if(!people.length)return;
  bal[e.paid_by]+=amount;
  people.forEach(p=>{if(p in bal)bal[p]-=amount/people.length});
 });
 el("balances").innerHTML=friends.map(p=>
 `<div class="item">${p}<strong style="float:right;color:${bal[p]>=0?'#64e6b1':'#ff9b9b'}">${bal[p]>=0?'+':'−'}${money(Math.abs(bal[p]))}</strong></div>`
 ).join("");

 let creditors=friends.map(p=>({name:p,amount:bal[p]})).filter(x=>x.amount>0.01);
 let debtors=friends.map(p=>({name:p,amount:-bal[p]})).filter(x=>x.amount>0.01);
 let transfers=[];
 for(const d of debtors){
  for(const c of creditors){
   const n=Math.min(d.amount,c.amount);
   if(n>0.01){
    transfers.push(`${d.name} pays ${c.name} ${money(n)}`);
    d.amount-=n;c.amount-=n;
   }
  }
 }
 el("settlement").innerHTML=transfers.length?transfers.map(t=>`<div class="item">${safe(t)}</div>`).join(""):'<p class="small">Everyone is settled up!</p>';
}

async function addExpense(){
 if(busy)return;
 const description=el("desc").value.trim();
 const amount=Number(el("amount").value);
 const paid_by=el("payer").value;
 const split_between=[...document.querySelectorAll(".person:checked")].map(x=>x.value);
 if(!description||!Number.isFinite(amount)||amount<=0||!split_between.length){
  alert("Enter a description, a valid amount, and at least one person to split with.");return;
 }
 busy=true;el("add").disabled=true;
 const {error}=await db.from("expenses").insert([{description,amount,paid_by,split_between}]);
 busy=false;el("add").disabled=false;
 if(error){setStatus("Could not save: "+error.message);return}
 el("desc").value="";el("amount").value="";
 await loadExpenses();
}

async function deleteExpense(id){
 if(!confirm("Delete this shared expense for everyone?"))return;
 const {error}=await db.from("expenses").delete().eq("id",id);
 if(error){setStatus("Could not delete: "+error.message);return}
 await loadExpenses();
}

el("rate").addEventListener("input",render);
db.channel("shared-expenses")
 .on("postgres_changes",{event:"*",schema:"public",table:"expenses"},loadExpenses)
 .subscribe();
 db.auth.onAuthStateChange(() => {
  setTimeout(refreshAuth, 0);
});
refreshAuth();
loadExpenses();
</script>

<footer class="built-by">
  Made with <span>♥</span> & a little ☕ by <strong>DJ</strong>
</footer>
  
</body>
</html>
